<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un mensaje para ti</title>

  <meta http-equiv="refresh" content="9;url=https://www.instagram.com/icjerusalen7?utm_source=qr&lqvp=MTJuY24wOXVuNDZ0aw==">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background-color: #f4efe6;
      color: #3b2f2f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .tarjeta {
      max-width: 460px;
      background-color: #fffdf9;
      border: 1px solid #d6c7b2;
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 10px 25px rgba(59, 47, 47, 0.08);
    }

    .etiqueta {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9c7a4c;
      margin-bottom: 18px;
    }

    .pregunta {
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      color: #7a5c38;
      margin-bottom: 16px;
    }

    .versiculo {
      font-size: 21px;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .aviso {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #8c7d6b;
      margin-bottom: 14px;
    }

    .enlace-manual {
      display: inline-block;
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #7a5c38;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="tarjeta">
    <div class="etiqueta">Palabra de aliento</div>

    <p class="pregunta">¿Quieres encontrar pareja?</p>

    <p class="versiculo">
      “No te conformes con cualquiera por miedo a estar solo; Dios tiene alguien que suma a tu vida en lugar de restarte paz.”
    </p>

    <p class="aviso">QUIERES UN CONSEJO? ESCRIBENOS...</p>

    <a class="enlace-manual" href="https://www.instagram.com/icjerusalen7?utm_source=qr&lqvp=MTJuY24wOXVuNDZ0aw==">
      Ir a Instagram ahora
    </a>
  </main>

</body>
</html>
